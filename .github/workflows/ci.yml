name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libmp3lame-dev libopus-dev libasound2-dev

      - name: Build fdk-aac (no distro package; see README)
        run: |
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac /tmp/fdk-aac
          cd /tmp/fdk-aac
          ./autogen.sh && ./configure --prefix=/usr/local
          make -j$(nproc) && sudo make install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --lib

      - name: Release build
        run: cargo build --release