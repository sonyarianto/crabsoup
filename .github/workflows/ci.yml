name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libmp3lame-dev libopus-dev libasound2-dev

      - name: Cache fdk-aac
        id: cache-fdk
        uses: actions/cache@v4
        with:
          path: /tmp/fdk-aac
          key: ${{ runner.os }}-fdk-aac-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build fdk-aac (no distro package; see README)
        if: steps.cache-fdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac /tmp/fdk-aac
          cd /tmp/fdk-aac
          ./autogen.sh && ./configure --prefix=/usr/local
          make -j$(nproc) && sudo make install
          sudo ldconfig

      - name: Install fdk-aac from cache
        if: steps.cache-fdk.outputs.cache-hit == 'true'
        run: |
          cd /tmp/fdk-aac && sudo make install && sudo ldconfig

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --lib

      - name: Release build
        run: cargo build --release

  minimal:
    name: test + clippy + build (minimal — no default codecs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-minimal-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-minimal-cargo-

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --lib --no-default-features

      - name: Release build
        run: cargo build --release --no-default-features

  video:
    name: test + clippy + build (video + soundcard features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libmp3lame-dev libopus-dev libasound2-dev nasm libx264-dev

      - name: Cache fdk-aac
        id: cache-fdk-video
        uses: actions/cache@v4
        with:
          path: /tmp/fdk-aac
          key: ${{ runner.os }}-fdk-aac-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build fdk-aac (no distro package; see README)
        if: steps.cache-fdk-video.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac /tmp/fdk-aac
          cd /tmp/fdk-aac
          ./autogen.sh && ./configure --prefix=/usr/local
          make -j$(nproc) && sudo make install
          sudo ldconfig

      - name: Install fdk-aac from cache
        if: steps.cache-fdk-video.outputs.cache-hit == 'true'
        run: |
          cd /tmp/fdk-aac && sudo make install && sudo ldconfig

      - name: Cache FFmpeg 8.1.2
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ffmpeg-8.1.2.tar.xz
            ffmpeg-8.1.2
          key: ${{ runner.os }}-ffmpeg-8.1.2

      - name: Build FFmpeg 8.1.2 from source (security floor; see README)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -O https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          tar xf ffmpeg-8.1.2.tar.xz && cd ffmpeg-8.1.2
          ./configure --prefix=/usr/local --enable-gpl --enable-libx264 \
                      --enable-shared --enable-pic
          make -j$(nproc) && sudo make install
          sudo ldconfig

      - name: Install FFmpeg from cache
        if: steps.cache-ffmpeg.outputs.cache-hit == 'true'
        run: |
          cd ffmpeg-8.1.2 && sudo make install && sudo ldconfig

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-video-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-video-cargo-

      - name: Clippy
        run: cargo clippy --all-targets --features video,soundcard -- -D warnings

      - name: Tests
        run: cargo test --lib --features video,soundcard

      - name: Release build
        run: cargo build --release --features video,soundcard