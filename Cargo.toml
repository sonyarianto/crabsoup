[package]
name = "crabsoup"
version = "0.1.0"
edition = "2024"
description = "Liquidsoap-inspired audio streaming engine: playlist scheduling, crossfades, live DJ ducking, Icecast output (MP3/Opus)"
license = "MIT"

[dependencies]
# Audio decoding + resampling
symphonia = { version = "0.5", features = ["all"] }
# Basic auth decoding for the live harbor
base64 = "0.22"
# Concurrency & async (live harbor)
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"
# Lock-free SPSC ring for the harbor -> mixer live handoff (replaces
# Arc<Mutex<VecDeque>>; ~13x faster on the audio-thread pull per the
# live_handoff comparison bench)
ringbuf = "0.4"
# Terminal interface
clap = { version = "4.0", features = ["derive"] }
# Logging
log = "0.4"
env_logger = "0.11"
# JSON replies for the control port (`json <command>`); serde_json's
# serializer (not hand-rolled escaping) so arbitrary titles/paths/Lua text
# are always well-formed.
serde_json = "1.0"
# Track ordering randomness
rand = { version = "0.8", features = ["small_rng"] }
# Local time for dayparting (`switch` predicates)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Opus encoding (libopus FFI) + Ogg muxing
audiopus = "0.3.0-rc.0"
ogg = "0.9"
# TLS for `https://` request resolution: wraps the hand-rolled HTTP/1.1
# client's TcpStream (ring provider — pure Rust, no system TLS deps).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
# Cross-platform audio device I/O (Part F2: `input.soundcard` /
# `output.soundcard`).
cpal = "0.15"
# .liq scripting (Liquidsoap-style config in Lua); vendored Lua 5.4,
# no `send` feature: sources are Rc-based and stay on the main thread.
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }
# Video decode/mux/encode (Part H1): binds to the system FFmpeg via
# pkg-config, so plain builds skip libav entirely.
ffmpeg-next = { version = "7.1", optional = true }

[features]
# Video support (Part H): off by default so core builds stay libav-free.
video = ["dep:ffmpeg-next"]

[dev-dependencies]
criterion = "0.5"
# Self-signed certs for the local TLS test server (https download tests).
rcgen = "0.13"

[[bench]]
name = "engine"
harness = false

[profile.release]
lto = true
